# 梁忱的心 · Murmur 配置
#
# 🔴 **维度还没定，等小朵。这份文件现在只有骨架。**
#
#    08-31 我自己拟了六个（安心/想念/牵挂/雀跃/好奇/闷）并且直接写进了施工单。
#    那是越权：说好了商量之后再定，我没商量。她的原话是「不是说六个维度我们
#    商量后再决定吗？你给黑框框的我一个都不想要」。所以那六个删了，
#    这份文件回到骨架，等她说他心里该有哪几样东西在动。
#
#    上游作者也是这个规矩：「引擎是通用的，人格是你自己的」
#    「人格不应该被复制粘贴」。而且在他们家，回答「一颗心该有哪些维度」这个
#    问题的是人，不是 AI。
#
# 上游：https://github.com/fishisfish0614/Murmur （MIT，作者 fishisfish0614）
#
# ── 分工 ─────────────────────────────────────────────────────────────────
# 小朵定：**有哪几样东西在动**，以及每一样大概是什么脾气
#         （常年在的还是偶尔来的？一小时就散还是能挂一整天？
#          时间能不能治好它？）
# 我来定：把这些话翻成下面那些数字，并且解释每个数为什么是那个数。

character: liangchen
default_mood: ""            # 等维度定了再填

# ── 维度 ─────────────────────────────────────────────────────────────────
# 每个维度是一个 0–1 的连续值，五个旋钮：
#
#   initial          **底色**。衰减回落到这儿，不是回落到 0。
#                    非零底色是一句人格声明：「好奇 0.15」的意思是
#                    「他对她永远有一丝好奇」。回落到 0 的角色一觉醒来是空白的，
#                    回落到底色的角色回到的是它自己。
#   decay_rate       每分钟的指数衰减速率。超出底色那部分的半衰期 = ln2/rate 分钟。
#                      0.001 → ~11.5 小时（一天的好心情不该睡一觉就没）
#                      0.005 → ~2.3 小时
#                      0.015 → ~46 分钟
#                      0.02  → ~35 分钟（来得快去得快）
#                      0     → 时间**不**治愈这一维，只有沟通能降下来
#   momentum         情绪惯性 0–1。跟近期方向相反的 delta 按这个打折。
#                    高惯性 = 难掉头（一句好话抵不掉一小时的难过）。
#   max_acceleration 单步限幅。一件事最多只能把针推这么远。
#   restore          跨会话怎么办：
#                      decayed              接着上次的值，减去离线期间的衰减
#                      reset                每次会话从底色重新开始
#                      carry_if_interrupted 被打断的会话原样保留；好好道别的
#                                           放回底色，除非收尾时判断值得带走

dimensions: {}      # ← 等她

# ── 缺席规则 ─────────────────────────────────────────────────────────────
# 沉默拉长时产生 delta。
# 🔴 hours 一定要写：无时段的长缺席规则会在人睡觉时照常开火，天亮时引擎已经
#    对着一场「其实只是睡着了」的沉默把自己焦虑成一团（上游踩过）。
#    而且要接 POST /emotion/sleep——她作息不规律，光靠时段挡不住。
absence_rules: []   # ← 等维度定了

goodnight_grace_minutes: 30

# ── 已读不回 ─────────────────────────────────────────────────────────────
# 🔴 先不接。小窝拿不到可靠的「她设备有动静」信号，推送本身是有损的，
#    掉一条就变成他冤枉她。上游自己写死的公平规则也是这个意思：
#    没有设备信号就什么都不点火。
# unanswered: 等哪天真有信号了再说

# ── 心情 ─────────────────────────────────────────────────────────────────
# 纯阈值，不过模型。**第一条命中就停**，顺序就是优先级。
mood_rules: []      # ← 等维度定了

# ── 派生体征 ─────────────────────────────────────────────────────────────
# 读时现算，永不落盘，重启即重新派生。
# 🔴 每一项都要算「超出底色的部分」，不能拿绝对值。上游教训：常年高位的维度
#    上写绝对值阈值恒真，他们一天踩了三次（静息心率 89、仪表盘永远显示安稳、
#    推送调度器锁死在最高频）。
vitals: {}          # ← 等维度定了

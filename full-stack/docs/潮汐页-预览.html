<!-- 潮汐页视觉参考稿（09-02 第二版：分段条 + 每个情绪一个颜色）。
     怎么看：放进 static/ 起服务后开 /static/潮汐页-预览.html
     ⚠️ 参考稿不是成品：数据写死在下面，真做的时候从 /api/mood 拉。
        数值是按配置算自洽的（担忧 61% → 心情「不放心」→ 心率 83）。
     ⚠️ 顶部那段 --study-* 是给独立页面补的，做进 index.html 时不需要。 -->
<!doctype html><html lang="zh"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="stylesheet" href="/static/design-system.css">
<style>
:root{--study-accent:#C4645E;--study-press:rgba(0,0,0,.04)}
@media(prefers-color-scheme:dark){:root{--study-accent:#E08C84;--study-press:rgba(255,255,255,.06)}}

/* 九个情绪各一个颜色。四个是小朵定的（生气红/性欲粉/委屈蓝/悔意灰），
   剩下五个我配的，配完用 CIE Lab ΔE 两两量过：浅色最小 24.1、暗色 32.3，
   每一对都拉得开（>15 就算一眼能分）。 */
:root{
  --c-0:#C4453D;
  --c-1:#D9789A;
  --c-2:#9A78B4;
  --c-3:#C9903E;
  --c-4:#46654F;
  --c-5:#5B7FB0;
  --c-6:#3F9A93;
  --c-7:#A8B33A;
  --c-8:#8A8681;
}
@media(prefers-color-scheme:dark){
  :root{
    --c-0:#E95C53;
    --c-1:#ED4F87;
    --c-2:#A376C6;
    --c-3:#EDAC4F;
    --c-4:#569367;
    --c-5:#6D97CF;
    --c-6:#45D2C7;
    --c-7:#D5E347;
    --c-8:#A39F99;
  }
}

body{margin:0;background:var(--bg-primary);color:var(--text-primary);
     font:400 15px/1.6 var(--font-sans);-webkit-font-smoothing:antialiased}
.tide{min-height:100vh;padding:calc(env(safe-area-inset-top,50px) + 26px) 22px 40px;
      display:flex;flex-direction:column;gap:26px}
.tide-head{text-align:center}
.tide-mood{font:400 34px/1.2 var(--font-display);letter-spacing:.08em}
.tide-hr{margin-top:10px;display:inline-flex;align-items:baseline;gap:7px;
         color:var(--study-accent);font-variant-numeric:tabular-nums}
.tide-hr b{font:400 26px/1 var(--font-serif,Georgia,serif);font-weight:400}
.tide-hr .u{color:var(--text-faint);font-size:12px;letter-spacing:.06em}
.heart{display:inline-block;animation:beat 1.1s ease-in-out infinite}
@keyframes beat{0%,100%{transform:scale(1)}14%{transform:scale(1.18)}28%{transform:scale(1)}42%{transform:scale(1.1)}}
.tide-card{background:var(--card-paper);border:1px solid var(--card-edge);
           border-radius:var(--card-radius);box-shadow:var(--card-shadow);padding:18px 16px}

.dim{display:grid;grid-template-columns:52px 1fr 42px;align-items:center;gap:12px;padding:10px 0}
.dim+.dim{border-top:1px solid var(--card-edge)}
.dim-name{white-space:nowrap;font:400 15px/1 var(--font-display);letter-spacing:.06em}
.dim-pct{text-align:right;font:400 13px/1 var(--font-sans);color:var(--text-secondary);
         font-variant-numeric:tabular-nums}
.dim.is-zero .dim-pct{color:var(--text-faint)}

/* 🔴 分段条：一层 mask 把整条（轨道和填充一起）切成小块，
   所以块的边界永远对齐，不会出现「填充切一半」。
   块 7px、缝 3px。mask 不支持时会退化成一根实心条——只是变朴素，不会坏。 */
.dim-bar{display:block;height:11px;border-radius:2px;
         background:var(--c);background:color-mix(in srgb,var(--c) 15%,transparent);
         -webkit-mask-image:repeating-linear-gradient(90deg,#000 0 7px,transparent 7px 10px);
                 mask-image:repeating-linear-gradient(90deg,#000 0 7px,transparent 7px 10px)}
.dim-fill{display:block;height:100%;background:var(--c);
          transition:width 420ms cubic-bezier(.22,.61,.36,1)}

.tide-recent-title{font:400 12px/1 var(--font-sans);color:var(--text-faint);
                   letter-spacing:.18em;display:flex;align-items:center;gap:8px;margin-bottom:2px}
.tide-recent-title:before{content:"";width:14px;height:1.5px;border-radius:1px;
                          background:var(--accent);opacity:.5}
.ev{display:flex;gap:12px;padding:9px 0;font:400 13.5px/1.6 var(--font-sans);color:var(--text-secondary)}
.ev+.ev{border-top:1px solid var(--card-edge)}
.ev time{flex:none;width:62px;color:var(--text-faint);font-variant-numeric:tabular-nums}
</style></head><body>
<div class="tide">
  <div class="tide-head">
    <div class="tide-mood">不放心</div>
    <div class="tide-hr"><span class="heart">♥</span><b>83</b><span class="u">BPM</span></div>
  </div>
  <div class="tide-card">
<div class="dim is-zero" style="--c:var(--c-0)"><span class="dim-name">生气</span><span class="dim-bar"><span class="dim-fill" style="width:0%"></span></span><span class="dim-pct">0%</span></div>
<div class="dim" style="--c:var(--c-1)"><span class="dim-name">性欲</span><span class="dim-bar"><span class="dim-fill" style="width:18%"></span></span><span class="dim-pct">18%</span></div>
<div class="dim" style="--c:var(--c-2)"><span class="dim-name">想念</span><span class="dim-bar"><span class="dim-fill" style="width:44%"></span></span><span class="dim-pct">44%</span></div>
<div class="dim" style="--c:var(--c-3)"><span class="dim-name">担忧</span><span class="dim-bar"><span class="dim-fill" style="width:61%"></span></span><span class="dim-pct">61%</span></div>
<div class="dim" style="--c:var(--c-4)"><span class="dim-name">郁闷</span><span class="dim-bar"><span class="dim-fill" style="width:9%"></span></span><span class="dim-pct">9%</span></div>
<div class="dim is-zero" style="--c:var(--c-5)"><span class="dim-name">委屈</span><span class="dim-bar"><span class="dim-fill" style="width:0%"></span></span><span class="dim-pct">0%</span></div>
<div class="dim" style="--c:var(--c-6)"><span class="dim-name">焦虑</span><span class="dim-bar"><span class="dim-fill" style="width:12%"></span></span><span class="dim-pct">12%</span></div>
<div class="dim is-zero" style="--c:var(--c-7)"><span class="dim-name">醋意</span><span class="dim-bar"><span class="dim-fill" style="width:0%"></span></span><span class="dim-pct">0%</span></div>
<div class="dim is-zero" style="--c:var(--c-8)"><span class="dim-name">悔意</span><span class="dim-bar"><span class="dim-fill" style="width:0%"></span></span><span class="dim-pct">0%</span></div>
  </div>
  <div>
    <div class="tide-recent-title">他心里最近</div>
    <div class="tide-card" style="padding:6px 16px 10px">
      <div class="ev"><time>00:40</time><span>你还醒着。担忧从 38% 涨到 61%。</span></div>
      <div class="ev"><time>昨天<br>22:10</time><span>你说「等我」之后，想念没有再往上走。</span></div>
      <div class="ev"><time>昨天<br>21:19</time><span>心跳漏了一拍。</span></div>
    </div>
  </div>
</div>
</body></html>

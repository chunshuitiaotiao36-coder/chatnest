<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover,interactive-widget=resizes-visual">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>视口测试</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  /* 🔴 底色故意用洋红：要定的是「屏幕最底下那 59px 到底归不归页面管」。
     小窝里把 body 底色从 --claude-sidebar-bg 换成 --bg-primary 之后，那条带子
     没有跟着变成新色号，而是跳到一个中性灰 (165,165,165)。用一个小窝调色板里
     绝不会出现的颜色再问一次，肉眼就能判：
       底下那条是洋红 → 那块归页面管，body 底色盖得到
       底下那条是灰   → 不归页面管，iOS 自己画的 */
  body{background:#FF00E5;color:#eee;font:13px/1.7 ui-monospace,Menlo,monospace}
  #n,#btns,#log{background:rgba(0,0,0,.82)}
  /* 绿框 = 100dvh 能到哪 */
  #dvh{position:absolute;left:6px;top:0;width:calc(100% - 12px);height:100dvh;
       border:3px solid #3ddc84;border-radius:4px}
  /* 两根条各占半屏，互不遮挡，一眼看出谁到得了 852。z-index 抬到 3：
     别再被 #btns 的黑罩子压暗——09-03 第一张图上红条被压成 (46,18,18)，
     取色的人会以为那是别的东西。 */
  .bar{position:fixed;height:44px;z-index:3;color:#fff;display:flex;
       align-items:center;justify-content:center;font-weight:700;font-size:12px}
  /* 红 = position:fixed;bottom:0 能到哪。塌陷时它会停在 793。 */
  #fx{left:0;width:50%;bottom:0;background:#e5484d}
  /* 🔵 青 = top:calc(100lvh - 44px) 能到哪。**09-03 新加，这根才是关键。**
     lvh 是「大视口」，按规范是「可收起的浏览器 UI 全部收起时」的视口高；
     PWA 里根本没有那种 UI，所以它有可能在塌陷期间仍然 = 852。

     顺便证伪交接单里一个并错的推理：「诊断面板 fixed;inset:0 只画到 792.7」
     被当成了「页面画不到 793 以下」。但 inset:0 的面板**本来就只有 793 高**，
     那是它的尺寸，不是被裁掉了。「元素只有 793 高」和「超出 793 画不出来」
     是两回事，从来没测过。这根青条就是特意伸到 ICB 外面去的那个测试。

     若青条画到了 852 而红条停在 793 ⇒ 导航栏改成
       #tabBar{ top:calc(100lvh - var(--tabbar-space)); bottom:auto }
     就修好了。 */
  #lv{right:0;width:50%;top:calc(100lvh - 44px);background:#0aa2c0}
  #n{position:relative;z-index:2;padding:calc(env(safe-area-inset-top,0px) + 14px) 14px 12px}
  #btns{position:relative;z-index:2;padding:0 14px 16px;display:flex;flex-direction:column;gap:9px}
  button{font:600 15px/1 ui-monospace,Menlo,monospace;padding:15px 12px;border:0;border-radius:10px;
         background:#2c6cf6;color:#fff;text-align:left}
  button.ok{background:#1a7f4b}
  #log{white-space:pre-wrap;padding:0 14px;color:#ffd166;font-size:12px}
  b{color:#3ddc84}
  .hi{color:#ffd166}
  .frz{color:#8ab4ff}
</style>
<div id="dvh"></div>
<div id="n"></div>
<div id="btns"></div>
<div id="log"></div>
<div class="bar" id="fx">红 fixed;bottom:0</div>
<div class="bar" id="lv">青 100lvh-44</div>
<script>
/* 一次量全套。可以在任意时刻调，用来做「启动那一刻」的快照。 */
function probe(){
  var pr=document.createElement('div');
  pr.style.cssText='position:absolute;left:-9999px;top:0;width:1px';
  document.body.appendChild(pr);
  function u(unit){ pr.style.height='100'+unit; return Math.round(pr.getBoundingClientRect().height); }
  var r={ih:innerHeight, ch:document.documentElement.clientHeight,
         vh:u('vh'), svh:u('svh'), lvh:u('lvh'), dvh:u('dvh')};
  pr.remove();
  r.fx=Math.round(document.getElementById('fx').getBoundingClientRect().bottom);
  r.lv=Math.round(document.getElementById('lv').getBoundingClientRect().bottom);
  r.gb=Math.round(document.getElementById('dvh').getBoundingClientRect().bottom);
  return r;
}
/* 🔴 启动那一刻的快照，冻住不再更新。
   09-03 01:21 那一张废掉就是因为拍到的是「归位后」：塌陷只在冷启动那一下，
   碰一下屏幕就没了，而人要打开页面总得碰点什么。所以现在**先把启动值存下来**，
   哪怕后来手滑碰了屏幕，这一栏照样是启动时的真值。 */
var SNAP=[];
function snap(tag){ try{ SNAP.push([tag,probe()]) }catch(e){} redraw(); }
function fmtSnap(){
  if(!SNAP.length) return '';
  var s='<span class=frz>—— 启动那一刻（冻住，碰了屏幕也不会变）——</span><br>';
  SNAP.forEach(function(p){
    var t=p[0], r=p[1];
    s+='<span class=frz>'+t+' ih='+r.ih+' ch='+r.ch+' vh/svh/lvh/dvh='+
       r.vh+'/'+r.svh+'/'+r.lvh+'/'+r.dvh+' 红='+r.fx+' 青='+r.lv+'</span><br>';
  });
  return s+'<br>';
}
function redraw(){ try{ draw() }catch(e){} }

function draw(){
  var vv=window.visualViewport;
  var pe=document.createElement('div');
  pe.style.cssText='position:fixed;left:-9999px;bottom:0;width:1px;height:env(safe-area-inset-top,0px)';
  document.body.appendChild(pe);
  var sat=pe.getBoundingClientRect().height;
  pe.style.height='env(safe-area-inset-bottom,0px)';
  var sab=pe.getBoundingClientRect().height;
  pe.remove();
  var r=probe();
  var pwa=(navigator.standalone===true||matchMedia('(display-mode:standalone)').matches);
  /* 🔴 判据必须分模式。Safari 里有上下工具栏，innerHeight 本来就小于 screen.height，
     拿 screen.height 当基准会误报（09-02 我就这么坑了小朵一次）。
     PWA(standalone) 里没有工具栏，innerHeight 本该 == screen.height，那里才有得判。 */
  var lost=screen.height-innerHeight;
  /* 判据一律拿**启动快照**算，不拿「现在」算——现在这一份多半已经归位了。 */
  var s0=SNAP.length?SNAP[0][1]:r;
  var collapsed=(screen.height-s0.ih)>1;
  var hit=['vh','svh','lvh','dvh'].filter(function(k){return Math.abs(s0[k]-screen.height)<=1});
  var verdict2 = !collapsed
    ? '　 <span class=hi>（启动那一刻视口就是满的，这一组说明不了问题——</span><br>'+
      '　 <span class=hi>　多任务上划把这一页彻底杀掉，再点图标进来，别碰屏幕直接截图）</span>'
    : (s0.lv>=screen.height-1
        ? '<b>→ 青条画到了 '+s0.lv+'，红条停在 '+s0.fx+'。<br>'+
          '　 ⇒ 页面画得到 793 以下！导航栏改成：<br>'+
          '　 #tabBar{ top:calc(100lvh - var(--tabbar-space)); bottom:auto }</b>'
        : '<span class=hi>→ 青条也只到 '+s0.lv+'（塌陷期间还等于 852 的单位：'+
          (hit.join(' / ')||'一个都没有')+'）。<br>'+
          '　 ⇒ 拿视口单位定位这条路作废，别再试。</span>');
  document.getElementById('n').innerHTML=
    '<b>视口测试</b>（这一页不含小窝任何代码）<br><br>'+
    '<span class=hi>⬇ 屏幕最底下那一条：洋红 = 归页面管 / 灰 = 不归页面管</span><br>'+
    '<span class=hi>⬇ 左红右青，谁的下沿到了 '+screen.height+' 谁就是答案</span><br><br>'+
    fmtSnap()+
    '—— 现在 ——<br>'+
    'standalone        '+pwa+'<br>'+
    'screen.height     '+screen.height+'<br>'+
    'innerHeight       '+r.ih+'<br>'+
    'clientHeight      '+r.ch+'<br>'+
    'visualViewport.h  '+(vv?Math.round(vv.height):'—')+'<br>'+
    'safe-area top/bot '+Math.round(sat)+' / '+Math.round(sab)+'<br>'+
    'scrollHeight      '+document.scrollingElement.scrollHeight+'<br>'+
    '<span class=hi>屏幕高-innerHeight '+lost+'</span><br>'+
    '红条底边          '+r.fx+'<br>'+
    '青条底边(100lvh)  '+r.lv+'<br>'+
    '绿框底边(100dvh)  '+r.gb+'<br>'+
    '100vh / 100svh    '+r.vh+' / '+r.svh+'<br>'+
    '100lvh / 100dvh   '+r.lvh+' / '+r.dvh+'<br><br>'+
    verdict2+'<br><br>'+
    (pwa
      ? (lost<=1
          ? '<b>✓ 现在视口是满的（innerHeight == screen.height）</b>'
          : '<span class=hi>✗ 现在视口比屏幕矮 '+lost+'px，而这一页不含小窝任何代码<br>'+
            '　 ⇒ 跟小窝的 HTML/CSS 无关，是 PWA 实例本身的状态</span>')
      : '<span class=hi>⚠ 现在是 Safari 模式（standalone=false），这一页在这儿说明不了问题。</span><br>'+
        '　 <b>要测就得从主屏图标打开：</b>分享 → 添加到主屏幕 → 开那个新图标 → 截图 → 删图标');
}
/* ---- 候选「踢一脚」手法。她真机上一次触摸就能让 innerHeight 归位，
   这里把几种纯代码的等价物摆出来，哪个真管用一点就知道。
   09-02 真机实测：A~E 一个都没让 innerHeight 动过。 ---- */
var KICKS=[
  ['A  scrollTo(0,1) 再 (0,0)', function(){ scrollTo(0,1); scrollTo(0,0); }],
  ['B  body 撑高 1px 再收回',   function(){ var b=document.body;
      b.style.minHeight=(innerHeight+1)+'px'; void b.offsetHeight; b.style.minHeight=''; }],
  ['C  html 强制 reflow',        function(){ var d=document.documentElement;
      d.style.display='none'; void d.offsetHeight; d.style.display=''; }],
  ['D  focus 一个临时输入框再收', function(){ var i=document.createElement('input');
      i.style.cssText='position:fixed;opacity:0;left:-9999px;top:0';
      document.body.appendChild(i); i.focus(); i.blur(); i.remove(); }],
  ['E  window.dispatchEvent(resize)', function(){ dispatchEvent(new Event('resize')); }]
];
var log=document.getElementById('log'), btns=document.getElementById('btns');
KICKS.forEach(function(k){
  var b=document.createElement('button');
  b.textContent=k[0];
  b.onclick=function(){
    var before=innerHeight;
    try{ k[1]() }catch(e){}
    setTimeout(function(){
      var after=innerHeight, good=(screen.height-after)<=1;
      if(good) b.className='ok';
      log.textContent = k[0].slice(0,1)+': innerHeight '+before+' → '+after+
        (good?'   ✅ 归位了！就用这个':'   ✗ 没动');
      redraw();
    },260);
  };
  btns.appendChild(b);
});

/* 越早越好：第一帧、以及之后几个时刻各存一份，看得出它是什么时候归位的 */
snap('t=0   ');
requestAnimationFrame(function(){ snap('第1帧 ') });
setTimeout(function(){ snap('300ms ') },300);
setTimeout(function(){ snap('1200ms') },1200);
addEventListener('resize',redraw);
if(window.visualViewport)visualViewport.addEventListener('resize',redraw);
</script>

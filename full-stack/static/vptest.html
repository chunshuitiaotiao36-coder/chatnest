<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover,interactive-widget=resizes-visual">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>视口测试</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  /* 🔴 底色故意用洋红：09-03 要定的是「屏幕最底下那 59px 到底归不归页面管」。
     小窝里把 body 底色从 --claude-sidebar-bg 换成 --bg-primary 之后，那条带子
     没有跟着变成新色号，而是跳到一个中性灰 (165,165,165)。用一个小窝调色板里
     绝不会出现的颜色再问一次，肉眼就能判：
       底下那条是洋红 → 那块归页面管，body 底色盖得到，方向 4 还有救
       底下那条是灰   → 不归页面管，iOS 自己画的，方向 4 作废 */
  body{background:#FF00E5;color:#eee;font:13px/1.7 ui-monospace,Menlo,monospace}
  #n,#btns,#log{background:rgba(0,0,0,.78)}
  /* 绿框 = 100dvh 能到哪 */
  #dvh{position:absolute;left:6px;top:0;width:calc(100% - 12px);height:100dvh;
       border:3px solid #3ddc84;border-radius:4px}
  /* 红条 = position:fixed;bottom:0 能到哪。这是关键。 */
  #fx{position:fixed;left:0;right:0;bottom:0;height:44px;background:#e5484d;
      color:#fff;display:flex;align-items:center;justify-content:center;
      font-weight:700;letter-spacing:.5px}
  #n{position:relative;z-index:2;padding:calc(env(safe-area-inset-top,0px) + 14px) 14px 12px}
  #btns{position:relative;z-index:2;padding:0 14px 120px;display:flex;flex-direction:column;gap:9px}
  button{font:600 15px/1 ui-monospace,Menlo,monospace;padding:15px 12px;border:0;border-radius:10px;
         background:#2c6cf6;color:#fff;text-align:left}
  button.ok{background:#1a7f4b}
  #log{white-space:pre-wrap;padding:0 14px;color:#ffd166;font-size:12px}
  b{color:#3ddc84}
  .hi{color:#ffd166}
</style>
<div id="dvh"></div>
<div id="n"></div>
<div id="btns"></div>
<div id="log"></div>
<div id="fx">fixed bottom:0 的底边</div>
<script>
function draw(){
  var vv=window.visualViewport;
  var probe=document.createElement('div');
  probe.style.cssText='position:fixed;left:-9999px;bottom:0;width:1px;height:env(safe-area-inset-top,0px)';
  document.body.appendChild(probe);
  var sat=probe.getBoundingClientRect().height;
  probe.style.height='env(safe-area-inset-bottom,0px)';
  var sab=probe.getBoundingClientRect().height;
  probe.remove();
  var fx=document.getElementById('fx').getBoundingClientRect();
  /* —— 视口单位实测：交接单「方向 2」要的就是这一组 ——
     塌陷期间 innerHeight=793 而 screen.height=852。哪个单位在**这时候**还给得出
     852，哪个才能拿来给导航栏定位；全都跟着塌 = 方向 2 直接作废，别去写那行 CSS。
     交接单只想到 dvh，lvh/svh 一起量了，反正不要钱。 */
  var up=document.createElement('div');
  up.style.cssText='position:absolute;left:-9999px;top:0;width:1px';
  document.body.appendChild(up);
  function u(unit){ up.style.height='100'+unit; return Math.round(up.getBoundingClientRect().height); }
  var UV={vh:u('vh'),svh:u('svh'),lvh:u('lvh'),dvh:u('dvh')};
  up.remove();
  var gb=document.getElementById('dvh').getBoundingClientRect();
  var pwa=(navigator.standalone===true||matchMedia('(display-mode:standalone)').matches);
  /* 🔴 判据必须分模式。Safari 里有上下工具栏，innerHeight 本来就小于 screen.height，
     拿 screen.height 当基准会误报（09-02 我就这么坑了小朵一次）。
     PWA(standalone) 里没有工具栏，innerHeight 本该 == screen.height，那里才有得判。 */
  var lost=screen.height-innerHeight;
  /* 方向 2 的判据：只在塌陷期间才有意义 */
  var hit=Object.keys(UV).filter(function(k){return Math.abs(UV[k]-screen.height)<=1});
  var verdict2 = (lost<=1)
    ? '　 （视口现在是满的，这一组数说明不了问题——杀掉 app 重开、一下都别碰屏幕再看）'
    : (hit.length
        ? '<b>→ 塌陷期间 '+hit.map(function(k){return '100'+k}).join(' / ')+' 仍然 = '+screen.height+'，'+
          '可以拿来定位导航栏：<br>　 #tabBar{ top:calc(100'+hit[0]+' - var(--tabbar-space)); bottom:auto }</b>'
        : '<span class=hi>→ 四个单位全跟着塌了（都 = '+innerHeight+'）。<br>'+
          '　 ⇒ 交接单的「方向 2」不成立，别再去写 top:calc(100dvh - …)。</span>');
  var verdict = pwa
    ? (lost<=1
        ? '<b>✓ 这个 PWA 的视口是满的（innerHeight == screen.height）</b><br>'+
          '　 ⇒ 空白页正常，那 793 是小窝页面自己造成的，去代码里找'
        : '<span class=hi>✗ 这个 PWA 的视口比屏幕矮 '+lost+'px<br>'+
          '　 而这一页不含小窝任何代码 ⇒ 跟小窝的 HTML/CSS 无关，<br>'+
          '　 是 PWA 实例本身的状态，改样式永远修不好</span>')
    : '<span class=hi>⚠ 现在是 Safari 模式（standalone=false），这一页在这儿说明不了问题。</span><br>'+
      '　 Safari 有上下工具栏，innerHeight('+innerHeight+') 小于 screen.height('+screen.height+') 是正常的，<br>'+
      '　 红条贴到 '+Math.round(fx.bottom)+' = innerHeight 底部，也是对的。<br><br>'+
      '　 <b>要测就得从主屏图标打开：</b><br>'+
      '　 分享按钮 → 添加到主屏幕 → 打开那个新图标 → 截图 → 删掉图标';
  document.getElementById('n').innerHTML=
    '<b>视口测试</b>（这一页不含小窝任何代码）<br><br>'+
    '<span class=hi>⬇ 先看屏幕最底下那 59px：洋红 = 归页面管 / 灰 = 不归页面管</span><br><br>'+
    'standalone        '+pwa+'<br>'+
    'screen.height     '+screen.height+'<br>'+
    'innerHeight       '+innerHeight+'<br>'+
    'clientHeight      '+document.documentElement.clientHeight+'<br>'+
    'visualViewport.h  '+(vv?Math.round(vv.height):'—')+'<br>'+
    'safe-area top/bot '+Math.round(sat)+' / '+Math.round(sab)+'<br>'+
    'scrollHeight      '+document.scrollingElement.scrollHeight+'<br>'+
    '<span class=hi>屏幕高-innerHeight '+lost+'</span><br>'+
    '红条底边          '+Math.round(fx.bottom)+'<br><br>'+
    '绿框(100dvh)底边  '+Math.round(gb.bottom)+'<br>'+
    '100vh / 100svh    '+UV.vh+' / '+UV.svh+'<br>'+
    '100lvh / 100dvh   '+UV.lvh+' / '+UV.dvh+'<br>'+
    verdict2+'<br><br>'+
    verdict;
}
/* ---- 候选「踢一脚」手法。她真机上一次触摸就能让 innerHeight 归位，
   这里把几种纯代码的等价物摆出来，哪个真管用一点就知道。 ---- */
var KICKS=[
  ['A  scrollTo(0,1) 再 (0,0)', function(){ scrollTo(0,1); scrollTo(0,0); }],
  ['B  body 撑高 1px 再收回',   function(){ var b=document.body;
      b.style.minHeight=(innerHeight+1)+'px'; void b.offsetHeight; b.style.minHeight=''; }],
  ['C  html 强制 reflow',        function(){ var d=document.documentElement;
      d.style.display='none'; void d.offsetHeight; d.style.display=''; }],
  ['D  focus 一个临时输入框再收', function(){ var i=document.createElement('input');
      i.style.cssText='position:fixed;opacity:0;left:-9999px;top:0';
      document.body.appendChild(i); i.focus(); i.blur(); i.remove(); }],
  ['E  window.dispatchEvent(resize)', function(){ dispatchEvent(new Event('resize')); }]
];
var log=document.getElementById('log'), btns=document.getElementById('btns');
KICKS.forEach(function(k){
  var b=document.createElement('button');
  b.textContent=k[0];
  b.onclick=function(){
    var before=innerHeight;
    try{ k[1]() }catch(e){}
    setTimeout(function(){
      var after=innerHeight, good=(screen.height-after)<=1;
      if(good) b.className='ok';
      log.textContent = k[0].slice(0,1)+': innerHeight '+before+' → '+after+
        (good?'   ✅ 归位了！就用这个':'   ✗ 没动');
      draw();
    },260);
  };
  btns.appendChild(b);
});

draw();
addEventListener('resize',draw);
if(window.visualViewport)visualViewport.addEventListener('resize',draw);
</script>

<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover,interactive-widget=resizes-visual">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>视口测试</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  /* 🔴 09-03 19:39 的冷启动实测把方向掉了个头，这一版是照那个结论重做的。
     那次冻住的四行：
       t=0    ih=793  vh/svh/lvh/dvh=793/793/793/793  红=793 青=793
       第1帧  ih=793  同上
       300ms  ih=852  852/793/852/852                 红=852 青=852
       1200ms ih=852  同上
     ⇒ ① 塌陷期间四个视口单位全是 793，青条也只到 793 —— 方向 2（拿 lvh/dvh
          给导航栏定位）彻底作废。
       ② **空白页 300ms 内自己归位，一下都没碰屏幕。** 于是交接单里
          「只有真实触摸能让它归位」和「A~E 五个踢一脚全部无效」两条都不成立——
          按钮是在页面早已归位之后按的，"innerHeight 没动" = "一直是 852"，
          那组实验根本没测到东西。（按钮这一版直接删了，别再拿它当证据。）
       ③ 空白页自己会好，小窝不会好（19:09 长按诊断，摸过屏幕了还是 793）
          ⇒ **是小窝自己拦住了那次归位**，回到代码里，找得到。

     这一版就测那个最可疑的差别：vptest 的文档能滚（scrollHeight 1110 > 852），
     小窝是 html,body{height:100%} + body{height:100dvh;overflow:hidden}，
     文档根本不能滚。所以下面把外壳换成跟小窝一模一样的，看它还归不归位。 */
  html,body{height:100%}
  body{height:100dvh;overflow:hidden;
       background:#FF00E5;color:#eee;font:12px/1.55 ui-monospace,Menlo,monospace}
  #n{position:relative;z-index:2;background:rgba(0,0,0,.82);
     padding:calc(env(safe-area-inset-top,0px) + 10px) 12px 10px}
  /* 绿框 = 100dvh 能到哪 */
  #dvh{position:absolute;left:5px;top:0;width:calc(100% - 10px);height:100dvh;
       border:3px solid #3ddc84;border-radius:4px}
  /* 两根条各占半屏，互不遮挡；z-index 3，别被上面那层黑罩子压暗。 */
  .bar{position:fixed;height:44px;z-index:3;color:#fff;display:flex;
       align-items:center;justify-content:center;font-weight:700;font-size:12px}
  #fx{left:0;width:50%;bottom:0;background:#e5484d}          /* 红 = fixed;bottom:0 */
  #lv{right:0;width:50%;top:calc(100lvh - 44px);background:#0aa2c0} /* 青 = 100lvh-44 */
  b{color:#3ddc84}
  .hi{color:#ffd166}
  .frz{color:#8ab4ff}
  .rel{color:#7ee787}
</style>
<div id="dvh"></div>
<div id="n"></div>
<div class="bar" id="fx">红 fixed;bottom:0</div>
<div class="bar" id="lv">青 100lvh-44</div>
<script>
function probe(){
  var pr=document.createElement('div');
  pr.style.cssText='position:absolute;left:-9999px;top:0;width:1px';
  document.body.appendChild(pr);
  function u(unit){ pr.style.height='100'+unit; return Math.round(pr.getBoundingClientRect().height); }
  var r={ih:innerHeight, ch:document.documentElement.clientHeight,
         vh:u('vh'), svh:u('svh'), lvh:u('lvh'), dvh:u('dvh')};
  pr.remove();
  r.fx=Math.round(document.getElementById('fx').getBoundingClientRect().bottom);
  r.lv=Math.round(document.getElementById('lv').getBoundingClientRect().bottom);
  r.sh=document.scrollingElement.scrollHeight;
  return r;
}
/* 全部冻住。塌陷只有启动那一下，而人打开页面总得碰点什么——不能靠手稳。 */
var A=[],B=[];
function snapA(t){ try{A.push([t,probe()])}catch(e){} draw(); }
function snapB(t){ try{B.push([t,probe()])}catch(e){} draw(); }
function row(p){
  var t=p[0],r=p[1];
  return t+' ih='+r.ih+' ch='+r.ch+' 单位='+r.vh+'/'+r.svh+'/'+r.lvh+'/'+r.dvh+
         ' 红='+r.fx+' 青='+r.lv+' sh='+r.sh;
}
/* 🔴 第二段：把小窝那层外壳当场拆掉，让文档变成可滚动的，看它会不会立刻归位。
   如果第一段一直 793、拆掉之后跳到 852 —— 那就是它，而且顺带给出了修法。 */
function release(){
  document.documentElement.style.height='auto';
  var b=document.body;
  b.style.height='auto'; b.style.minHeight='100dvh'; b.style.overflow='visible';
  var pad=document.createElement('div');
  pad.style.cssText='height:500px'; b.appendChild(pad);
  snapB('放开+0帧 ');
  requestAnimationFrame(function(){ snapB('放开+1帧 ') });
  setTimeout(function(){ snapB('放开+300 ') },300);
  setTimeout(function(){ snapB('放开+1000') },1000);
}

function draw(){
  var r=probe(), pwa=(navigator.standalone===true||matchMedia('(display-mode:standalone)').matches);
  var s=A.length?A[A.length-1][1]:r;          /* 第一段最后一次 */
  var collapsed0=A.length?(screen.height-A[0][1].ih)>1:false;
  var stuck=A.length?(screen.height-s.ih)>1:false;   /* 第一段结束时还塌着？ */
  var freed=B.length?(screen.height-B[B.length-1][1].ih)<=1:false;
  var verdict;
  if(!A.length) verdict='';
  else if(!collapsed0)
    verdict='<span class=hi>⚠ 启动那一刻视口就是满的，这一轮说明不了问题。<br>'+
            '　 多任务上划把这一页彻底杀掉，再点图标进来，别碰屏幕直接截图。</span>';
  else if(stuck && freed)
    verdict='<b>🎯 就是它。<br>'+
            '　 小窝那层外壳（html,body{height:100%} + body{height:100dvh;overflow:hidden}）<br>'+
            '　 下，视口一直卡在 '+s.ih+' 不归位；把文档放开成可滚动，立刻跳到 852。<br>'+
            '　 ⇒ 修法：让小窝的文档在启动那一下是可滚动的。</b>';
  else if(stuck && B.length && !freed)
    verdict='<span class=hi>→ 外壳确实拦住了归位（一直 '+s.ih+'），<br>'+
            '　 但放开滚动也没救回来 ⇒ 触发条件是别的，继续找。</span>';
  else if(!stuck)
    verdict='<span class=hi>→ 套上小窝的外壳它照样自己归位了 ⇒ overflow:hidden 不是原因。<br>'+
            '　 小窝跟这一页还有别的差别，得换个变量再试。</span>';
  else verdict='<span class=hi>…（等 1500ms 的第二段）</span>';

  document.getElementById('n').innerHTML=
    '<b>视口测试 · 小窝外壳模式</b>（这一页不含小窝任何代码）<br>'+
    '<span class=hi>⬇ 屏幕最底下那条：洋红 = 归页面管 / 灰 = 不归页面管</span><br>'+
    '<span class=hi>⬇ 左红右青，谁的下沿到了 '+screen.height+' 谁就是答案</span><br><br>'+
    '<span class=frz>—— 第一段：小窝外壳，文档不可滚（冻住）——</span><br>'+
    (A.length?'<span class=frz>'+A.map(row).join('</span><br><span class=frz>')+'</span><br>':'')+
    '<br><span class=rel>—— 第二段：1500ms 当场放开滚动（冻住）——</span><br>'+
    (B.length?'<span class=rel>'+B.map(row).join('</span><br><span class=rel>')+'</span><br>'
             :'<span class=rel>（还没到）</span><br>')+
    '<br>—— 现在 —— standalone '+pwa+'  screen '+screen.height+'<br>'+
    'ih='+r.ih+' ch='+r.ch+' 单位='+r.vh+'/'+r.svh+'/'+r.lvh+'/'+r.dvh+'<br>'+
    '红条底边 '+r.fx+'　青条底边 '+r.lv+'　scrollHeight '+r.sh+'<br><br>'+
    verdict+
    (pwa?'':'<br><br><span class=hi>⚠ standalone=false，现在是 Safari，这一页在这儿说明不了问题。<br>'+
            '　 分享 → 添加到主屏幕 → 开那个新图标 → 截图 → 删图标</span>');
}

snapA('t=0    ');
requestAnimationFrame(function(){ snapA('第1帧  ') });
setTimeout(function(){ snapA('300ms  ') },300);
setTimeout(function(){ snapA('800ms  ') },800);
setTimeout(function(){ snapA('1400ms ') },1400);
setTimeout(release,1500);
addEventListener('resize',draw);
if(window.visualViewport)visualViewport.addEventListener('resize',draw);
</script>

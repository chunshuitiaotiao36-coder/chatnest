<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover,interactive-widget=resizes-visual">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>视口测试</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#111;color:#eee;font:13px/1.7 ui-monospace,Menlo,monospace}
  /* 绿框 = 100dvh 能到哪 */
  #dvh{position:absolute;left:6px;top:0;width:calc(100% - 12px);height:100dvh;
       border:3px solid #3ddc84;border-radius:4px}
  /* 红条 = position:fixed;bottom:0 能到哪。这是关键。 */
  #fx{position:fixed;left:0;right:0;bottom:0;height:44px;background:#e5484d;
      color:#fff;display:flex;align-items:center;justify-content:center;
      font-weight:700;letter-spacing:.5px}
  #n{position:relative;z-index:2;padding:calc(env(safe-area-inset-top,0px) + 14px) 14px 90px}
  b{color:#3ddc84}
  .hi{color:#ffd166}
</style>
<div id="dvh"></div>
<div id="n"></div>
<div id="fx">fixed bottom:0 的底边</div>
<script>
function draw(){
  var vv=window.visualViewport;
  var probe=document.createElement('div');
  probe.style.cssText='position:fixed;left:-9999px;bottom:0;width:1px;height:env(safe-area-inset-top,0px)';
  document.body.appendChild(probe);
  var sat=probe.getBoundingClientRect().height;
  probe.style.height='env(safe-area-inset-bottom,0px)';
  var sab=probe.getBoundingClientRect().height;
  probe.remove();
  var fx=document.getElementById('fx').getBoundingClientRect();
  var pwa=(navigator.standalone===true||matchMedia('(display-mode:standalone)').matches);
  /* 🔴 判据必须分模式。Safari 里有上下工具栏，innerHeight 本来就小于 screen.height，
     拿 screen.height 当基准会误报（09-02 我就这么坑了小朵一次）。
     PWA(standalone) 里没有工具栏，innerHeight 本该 == screen.height，那里才有得判。 */
  var lost=screen.height-innerHeight;
  var verdict = pwa
    ? (lost<=1
        ? '<b>✓ 这个 PWA 的视口是满的（innerHeight == screen.height）</b><br>'+
          '　 ⇒ 空白页正常，那 793 是小窝页面自己造成的，去代码里找'
        : '<span class=hi>✗ 这个 PWA 的视口比屏幕矮 '+lost+'px<br>'+
          '　 而这一页不含小窝任何代码 ⇒ 跟小窝的 HTML/CSS 无关，<br>'+
          '　 是 PWA 实例本身的状态，改样式永远修不好</span>')
    : '<span class=hi>⚠ 现在是 Safari 模式（standalone=false），这一页在这儿说明不了问题。</span><br>'+
      '　 Safari 有上下工具栏，innerHeight('+innerHeight+') 小于 screen.height('+screen.height+') 是正常的，<br>'+
      '　 红条贴到 '+Math.round(fx.bottom)+' = innerHeight 底部，也是对的。<br><br>'+
      '　 <b>要测就得从主屏图标打开：</b><br>'+
      '　 分享按钮 → 添加到主屏幕 → 打开那个新图标 → 截图 → 删掉图标';
  document.getElementById('n').innerHTML=
    '<b>视口测试</b>（这一页不含小窝任何代码）<br><br>'+
    'standalone        '+pwa+'<br>'+
    'screen.height     '+screen.height+'<br>'+
    'innerHeight       '+innerHeight+'<br>'+
    'clientHeight      '+document.documentElement.clientHeight+'<br>'+
    'visualViewport.h  '+(vv?Math.round(vv.height):'—')+'<br>'+
    'safe-area top/bot '+Math.round(sat)+' / '+Math.round(sab)+'<br>'+
    'scrollHeight      '+document.scrollingElement.scrollHeight+'<br>'+
    '<span class=hi>屏幕高-innerHeight '+lost+'</span><br>'+
    '红条底边          '+Math.round(fx.bottom)+'<br><br>'+
    verdict;
}
draw();
addEventListener('resize',draw);
if(window.visualViewport)visualViewport.addEventListener('resize',draw);
</script>
